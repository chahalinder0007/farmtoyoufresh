   <script>
      document.addEventListener('mousemove', (event) => {
        // Extract relevant information from the mouse event
        const mouseX = event.clientX;
        const mouseY = event.clientY;
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;
    
        // Send mouse movement data to Google Analytics
        gtag('event', 'mouse_movement', {
          'event_category': 'Engagement',
          'event_label': 'Mouse Movement',
          'value': 1,
          'mouse_x': mouseX,
          'mouse_y': mouseY,
          'screen_width': screenWidth,
          'screen_height': screenHeight,
        });
      });
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-772YRVP6KQ"></script>

      function gtag(){dataLayer.push(arguments);}

      gtag('config', 'G-772YRVP6KQ');
